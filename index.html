<style>
/* =========================================================
   COLORS & FONTS  (change a color here and it changes everywhere)
   ========================================================= */
:root{
  --bg:#121214; --bg2:#1a1a1d; --card:#1d1e21; --line:rgba(237,234,227,.12);
  --ink:#edeae3; --ink-dim:#a9a69f; --gold:#c9a24b; --teal:#4a8fa0;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Light mode colors (used when the visitor's device is set to light mode) */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f4ef; --bg2:#efebe2; --card:#fff; --line:rgba(30,28,22,.12);
    --ink:#201e19; --ink-dim:#6b675e; --gold:#a37a25; --teal:#2f6b78;
  }
}
:root[data-theme="dark"]{ --bg:#121214; --bg2:#1a1a1d; --card:#1d1e21; --line:rgba(237,234,227,.12); --ink:#edeae3; --ink-dim:#a9a69f; --gold:#c9a24b; --teal:#4a8fa0; }

/* =========================================================
   BASIC PAGE SETUP
   ========================================================= */
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55; position:relative;}

/* Floating dots background */
#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: -1;
  transition: opacity 0.3s ease;
}

h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0 0 .4em;letter-spacing:-.01em;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:920px;margin:0 auto;padding:0 24px;}

/* =========================================================
   NAVIGATION BAR
   ========================================================= */
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;}
nav .name{font-family:var(--serif);font-size:1.05rem;}
nav .links{display:flex;gap:22px;font-size:.88rem;color:var(--ink-dim);}
nav .links a:hover{color:var(--gold);}
